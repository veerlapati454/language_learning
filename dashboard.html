<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wanderword · Learner Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #17171B;
      color: #EDE6D6;
      -webkit-font-smoothing: antialiased;
    }
    :root {
      --bg: #17171B;
      --surface: #1F1E23;
      --surface-2: #29282F;
      --border: rgba(237,230,214,0.09);
      --border-bright: rgba(237,230,214,0.20);
      --text: #EDE6D6;
      --text-dim: rgba(237,230,214,0.64);
      --text-dimmer: rgba(237,230,214,0.40);
      --accent: #C97A2E;
      --accent-bright: #E8A33D;
      --accent-soft: rgba(232,163,61,0.14);
      --accent-glow: rgba(232,163,61,0.32);
      --red: #C4514A;
      --red-bright: #D6685F;
      --green: #56906B;
      --green-bright: #72AC86;
      --blue: #416F91;
      --blue-bright: #5D8DAE;
      --violet: #7C5E92;
      --violet-bright: #9678AC;
      --display: 'Space Grotesk', sans-serif;
      --mono: 'IBM Plex Mono', monospace;
      --ease: cubic-bezier(.22,1,.36,1);
    }
    @media (prefers-reduced-motion: reduce){
      *{ animation-duration:.001ms !important; transition-duration:.001ms !important; }
    }
    ::selection{ background:var(--accent-bright); color:#17171B; }
    .classification-bar {
      background: var(--accent-bright); color: #1D1305;
      font-family: var(--mono); font-size: 0.7rem; font-weight: 700;
      letter-spacing: 0.14em; text-transform: uppercase; text-align: center;
      padding: 6px 10px; position: sticky; top: 0; z-index: 60;
    }
    .dashboard-root { display: flex; min-height: 100vh; width: 100%; max-width: 100vw; position:relative; }
    .dashboard-root::before{
      content:""; position:fixed; inset:0; z-index:0; pointer-events:none;
      background-image:radial-gradient(circle at 16% 20%, rgba(232,163,61,0.06) 0%, transparent 55%),
                       radial-gradient(circle at 84% 78%, rgba(65,111,145,0.07) 0%, transparent 50%);
    }
    .sidebar-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.72);
      z-index: 40; display: none; backdrop-filter: blur(4px);
    }
    .sidebar-overlay.show { display: block; animation: fadeIn .25s var(--ease); }
    @keyframes fadeIn{ from{ opacity:0; } to{ opacity:1; } }
    .sidebar {
      width: 260px; flex-shrink: 0; background: var(--surface);
      border-right: 1px solid var(--border); display: flex; flex-direction: column;
      padding: 20px 16px 16px; position: fixed; left: 0; top: 30px;
      height: calc(100vh - 30px); overflow-y: auto; z-index: 30;
      backdrop-filter: blur(8px);
    }
    .sidebar-header { display: flex; align-items: center; justify-content: center; margin-bottom: 18px; padding: 6px 4px; position: relative; }
    .brand { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; text-decoration:none; }
    .brand-logo-placeholder {
      width: 100%; height: 64px; border-radius: 6px; flex-shrink: 0;
      
     
      display: flex; align-items: center; justify-content: center;
      color: var(--text-dimmer); overflow: hidden; position: relative;
      transition: border-color .2s ease, background .2s ease;
    }
    .brand:hover .brand-logo-placeholder { border-color: var(--accent-bright); background: var(--accent-soft); }
    .brand-logo-placeholder img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .brand-logo-placeholder .placeholder-icon { font-size: 20px; opacity: .55; }
    .close-btn {
      display: none; background: none; border: none; color: var(--text-dim);
      font-size: 18px; padding: 4px 8px; cursor:pointer;
      position: absolute; right: 0; top: 50%; transform: translateY(-50%);
    }
    .unit-strip {
      font-family: var(--mono); font-size: 10px; font-weight: 700; letter-spacing: 0.08em;
      color: var(--accent-bright); text-transform: uppercase; text-align: center;
      padding: 8px 6px; margin-bottom: 14px; border: 1px solid var(--border-bright); border-radius: 3px;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      background: linear-gradient(180deg, rgba(232,163,61,0.08), transparent);
    }
    .unit-strip::before {
      content: ''; width: 7px; height: 7px; border-radius: 50%; background: var(--red-bright);
      box-shadow: 0 0 6px var(--red-bright);
      animation: blink 2.2s ease-in-out infinite;
    }
    @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }
    .sidebar-section-label {
      font-family:var(--mono); font-size: 10px; font-weight: 700; letter-spacing: 0.1em;
      color: var(--text-dimmer); text-transform: uppercase; margin: 14px 8px 8px;
    }
    .sidebar-nav { display: flex; flex-direction: column; gap: 2px; }
    .nav-item {
      display: flex; align-items: center; gap: 12px;
      background: none; border: none; width: 100%;
      padding: 10px 12px; border-radius: 3px;
      color: var(--text-dim); font-size: 13.5px; font-weight: 500;
      text-align: left; transition: all .2s ease; position: relative; cursor:pointer;
      border-left: 2px solid transparent;
    }
    .nav-item:hover { background: rgba(232,163,61,0.07); color: var(--text); }
    .nav-item.nav-active { background: var(--accent-soft); color: var(--accent-bright); font-weight: 600; border-left: 2px solid var(--accent-bright); }
    .nav-icon { font-size: 15px; width: 18px; text-align: center; flex-shrink: 0; }
    .nav-badge { margin-left: auto; background: var(--accent-bright); color: #1D1305; font-family:var(--mono); font-size: 10px; font-weight: 700; padding: 1px 7px; border-radius: 2px; }
    .sidebar-user {
      display: flex; align-items: center; gap: 10px;
      padding: 10px; margin-top: 16px; margin-bottom: 4px;
      border-radius: 3px; background: var(--surface-2); border: 1px solid var(--border);
    }
    .sidebar-user-avatar {
      width: 34px; height: 34px; border-radius: 50%; flex-shrink: 0;
      background: var(--accent-soft); color: var(--accent-bright);
      display: flex; align-items: center; justify-content: center;
      font-family:var(--mono); font-size: 13px; font-weight: 700; text-transform: uppercase;
    }
    .sidebar-user-info { min-width: 0; flex: 1; }
    .sidebar-user-name { font-size: 12.5px; font-weight: 700; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-transform:capitalize; }
    .sidebar-user-email { font-size: 11px; color: var(--text-dimmer); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .logout-full-btn {
      margin-top: 8px; width: 100%; padding: 11px; border-radius: 3px;
      background: rgba(196,81,74,0.08); border: 1px solid rgba(196,81,74,0.32);
      color: var(--red-bright); font-family:var(--mono); font-size: 12px; font-weight: 700; letter-spacing:.03em; text-transform:uppercase;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      transition: background .2s ease; text-decoration: none; cursor: pointer;
    }
    .logout-full-btn:hover { background: rgba(196,81,74,0.18); }
    .main-content { flex: 1; min-width: 0; max-width: 100%; display: flex; flex-direction: column; margin-left: 260px; position:relative; z-index:1; }
    .topbar {
      position: sticky; top: 30px; z-index: 25;
      display: flex; align-items: center; justify-content: space-between;
      gap: 12px; padding: 10px 24px;
      background: rgba(23,23,27,0.92); backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      flex-wrap: nowrap; min-height: 60px;
    }
    .topbar-left { display: flex; align-items: center; gap: 14px; min-width: 0; flex-shrink: 1; }
    .hamburger {
      display: none; flex-direction: column; justify-content: center; gap: 4px;
      width: 36px; height: 36px; border-radius: 3px;
      background: var(--surface-2); border: 1px solid var(--border);
      align-items: center; flex-shrink: 0; cursor:pointer;
    }
    .hamburger span { width: 16px; height: 2px; background: var(--text); border-radius: 2px; }
    .page-title { min-width: 0; display: flex; align-items: baseline; gap: 12px; white-space: nowrap; }
    .page-title h1 {
      font-family:var(--display); text-transform:uppercase; letter-spacing:.01em; font-size: 21px; font-weight: 700; margin: 0;
      color: var(--text); white-space: nowrap;
    }
    .page-title p { font-size: 12px; color: var(--text-dim); margin: 0; white-space: nowrap; font-family: var(--mono); }
    .topbar-right { display: flex; align-items: center; gap: 10px; flex-shrink: 0; margin-left: auto; }
    .search-box { display: flex; align-items: center; gap: 6px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 3px; padding: 6px 10px; min-width: 0; }
    .search-box input { background: none; border: none; outline: none; color: var(--text); font-size: 12px; width: 150px; max-width: 100%; min-width: 60px; font-family: var(--mono); }
    .search-box input::placeholder { color: var(--text-dimmer); font-size: 11px; }
    .search-icon { font-size: 12px; opacity: 0.7; }
    .icon-btn {
      position: relative; width: 34px; height: 34px; border-radius: 3px;
      background: var(--surface-2); border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center; font-size: 14px;
      flex-shrink: 0; cursor:pointer; transition:all .2s ease;
    }
    .icon-btn:hover{ border-color:var(--accent-bright); transform:translateY(-1px); box-shadow:0 0 12px var(--accent-glow); }
    .notif-dot {
      position: absolute; top: 6px; right: 6px; width: 6px; height: 6px;
      border-radius: 50%; background: var(--red-bright); border: 1.5px solid var(--surface-2);
      animation: notifPulse 2.2s ease-in-out infinite;
    }
    @keyframes notifPulse{ 0%,100%{ box-shadow:0 0 0 0 rgba(196,81,74,.5); } 50%{ box-shadow:0 0 0 4px rgba(196,81,74,0); } }
    .topbar-user { position: relative; flex-shrink: 0; }
    .topbar-user-btn {
      display: flex; align-items: center; gap: 8px;
      background: var(--surface-2); border: 1px solid var(--border);
      border-radius: 999px; padding: 3px 10px 3px 3px;
      transition: border-color .2s ease; cursor:pointer;
    }
    .topbar-user-btn:hover { border-color:var(--accent-bright); }
    .topbar-user-avatar {
      width: 26px; height: 26px; border-radius: 50%; flex-shrink: 0;
      background: var(--accent); color: #17171B;
      display: flex; align-items: center; justify-content: center;
      font-family:var(--mono); font-size: 11px; font-weight: 700; text-transform: uppercase;
    }
    .topbar-user-name { font-size: 11.5px; font-weight: 600; color: var(--text); max-width: 100px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-transform:capitalize; }
    .topbar-user-caret { font-size: 9px; color: var(--text-dimmer); }
    .topbar-user-menu {
      position: absolute; top: calc(100% + 8px); right: 0; width: 220px;
      background: var(--surface-2); border: 1px solid var(--border-bright);
      border-radius: 4px; padding: 8px;
      box-shadow: 0 18px 40px rgba(0,0,0,0.6);
      opacity: 0; visibility: hidden; transform: translateY(-6px);
      transition: opacity .2s var(--ease), transform .2s var(--ease), visibility .2s ease;
      z-index: 60;
    }
    .topbar-user.open .topbar-user-menu { opacity: 1; visibility: visible; transform: translateY(0); }
    .topbar-user-menu-email { padding: 8px 10px 10px; border-bottom: 1px solid var(--border); margin-bottom: 6px; }
    .topbar-user-menu-email .label { font-family:var(--mono); font-size: 9px; font-weight: 700; color: var(--text-dimmer); text-transform: uppercase; letter-spacing: .05em; }
    .topbar-user-menu-email .value { font-size: 11.5px; font-weight: 600; color: var(--text); margin-top: 2px; word-break: break-all; }
    .topbar-user-menu-item {
      display: flex; align-items: center; gap: 9px; width: 100%;
      padding: 8px 10px; border-radius: 3px;
      background: none; border: none; text-align: left;
      font-size: 11.5px; font-weight: 600; color: var(--text-dim);
      transition: background .15s ease, color .15s ease; cursor:pointer;
    }
    .topbar-user-menu-item:hover { background: rgba(232,163,61,0.08); color: var(--text); }
    .topbar-user-menu-item.danger:hover { background: rgba(196,81,74,0.15); color: var(--red-bright); }

    .content-area { padding: 24px 28px 48px; min-width: 0; max-width: 100%; overflow-x: hidden; }
    .hero-banner {
      position: relative; border-radius: 4px; overflow: hidden; margin-bottom: 20px;
      border: 1px solid var(--border-bright); min-height: 150px; display: flex; align-items: center;
      background: linear-gradient(120deg, rgba(41,40,47,.95), rgba(31,30,35,.9));
    }
    .hero-banner::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
      background: repeating-linear-gradient(90deg, var(--accent-bright) 0 5px, transparent 5px 7px);
    }
    .hero-banner-inner { padding: 26px 30px; max-width: 560px; }
    .hero-eyebrow { font-family:var(--mono); font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--accent-bright); margin-bottom: 8px; }
    .hero-banner h2 { font-family:var(--display); font-size: 24px; font-weight: 700; margin-bottom: 6px; color: var(--text); letter-spacing: -0.01em; }
    .hero-banner p { font-size: 13px; color: var(--text-dim); line-height: 1.5; }
    .stats-grid { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 16px; margin-bottom: 20px; }
    .stat-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 4px; padding: 18px 18px 16px; min-width: 0;
      transition: all .25s ease;
      opacity:0; transform:translateY(14px); animation: cardPop .5s var(--ease) forwards;
    }
    .stat-card[data-aos] { opacity: 0; animation: none; }
    .stats-grid .stat-card:nth-child(1){ animation-delay:.03s; }
    .stats-grid .stat-card:nth-child(2){ animation-delay:.09s; }
    .stats-grid .stat-card:nth-child(3){ animation-delay:.15s; }
    .stats-grid .stat-card:nth-child(4){ animation-delay:.21s; }
    @keyframes cardPop{ to{ opacity:1; transform:translateY(0); } }
    .stat-card:hover { border-color:var(--accent-bright); transform:translateY(-3px); box-shadow:0 8px 24px rgba(232,163,61,0.14); }
    .stat-accent { border-color:rgba(232,163,61,0.35); background:linear-gradient(145deg, rgba(232,163,61,0.07), var(--surface) 70%); }
    .stat-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
    .stat-icon { font-size: 18px; filter: drop-shadow(0 0 6px var(--accent-glow)); }
    .stat-delta { font-family:var(--mono); font-size: 10.5px; font-weight: 700; padding: 2px 8px; border-radius: 2px; }
    .stat-delta.up { color: var(--green-bright); background: rgba(86,144,107,0.16); }
    .stat-value { font-family:var(--display); font-size: 27px; font-weight: 700; letter-spacing: -0.01em; }
    .stat-label { font-size: 12.5px; color: var(--text-dim); margin-top: 4px; font-family: var(--mono); text-transform: uppercase; letter-spacing: 0.02em; }
    .stat-bar { height: 6px; background: rgba(237,230,214,0.07); border-radius: 2px; margin-top: 12px; overflow: hidden; }
    .stat-bar-fill {
      height: 100%; width:0; border-radius: 2px; transition: width 1.1s var(--ease) .3s;
      background: linear-gradient(90deg, var(--green), var(--accent-bright) 65%, var(--red));
      -webkit-mask-image: repeating-linear-gradient(90deg, #000 0 4px, transparent 4px 6px);
      mask-image: repeating-linear-gradient(90deg, #000 0 4px, transparent 4px 6px);
    }
    .mid-grid { display: grid; grid-template-columns: 1.7fr 1fr; gap: 16px; margin-bottom: 16px; align-items: start; }
    .bottom-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; align-items: start; }
    .card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 4px; padding: 20px; margin-bottom: 16px; min-width: 0;
      opacity:0; transform:translateY(14px); animation: cardPop .5s var(--ease) .1s forwards;
    }
    .card[data-aos] { opacity: 0; animation: none; }
    .card-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
    .card-title { font-family:var(--display); letter-spacing:.01em; font-size: 16px; font-weight: 700; margin: 0; color: var(--text); }
    .card-sub { font-size: 12px; color: var(--text-dim); margin: 3px 0 0; font-family: var(--mono); }
    .table-wrapper { overflow-x: auto; max-width: 100%; -webkit-overflow-scrolling: touch; }
    .runs-table { width: 100%; border-collapse: collapse; min-width: 600px; }
    .runs-table th {
      text-align: left; font-family:var(--mono); font-size: 10px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.06em; color: var(--text-dimmer);
      padding: 0 10px 10px; border-bottom: 1px solid var(--border);
    }
    .runs-table td { padding: 12px 10px; border-bottom: 1px dashed var(--border); font-size: 13px; vertical-align: middle; }
    .runs-table tr:last-child td { border-bottom: none; }
    .runs-table tbody tr { transition: background .15s ease; cursor:pointer; }
    .runs-table tbody tr:hover { background: rgba(232,163,61,0.06); }
    .t-name { font-weight: 600; font-size: 13px; }
    .t-sub { font-size: 11.5px; color: var(--text-dimmer); margin-top: 2px; font-family: var(--mono); }
    .type-col { color: var(--text-dim); }
    .date-col { color: var(--text-dim); white-space: nowrap; font-family: var(--mono); font-size: 12px; }
    .budget-col { font-weight: 700; white-space: nowrap; font-family:var(--mono); font-size:12.5px; color: var(--accent-bright); }
    .region-tag { font-family:var(--mono); font-size: 10.5px; font-weight: 700; padding: 3px 9px; border-radius: 2px; border: 1px solid; white-space: nowrap; text-transform: uppercase; }
    .status-badge { font-family:var(--mono); font-size: 10.5px; font-weight: 700; padding: 4px 10px; border-radius: 2px; white-space: nowrap; text-transform:uppercase; letter-spacing:.02em; }
    .status-active { background: rgba(86,144,107,0.16); color: var(--green-bright); }
    .status-field { background: rgba(232,163,61,0.16); color: var(--accent-bright); }
    .status-complete { background: rgba(124,94,146,0.2); color: var(--violet-bright); }
    .status-review { background: rgba(65,111,145,0.22); color: var(--blue-bright); }
    .progress-wrap { display: flex; align-items: center; gap: 8px; min-width: 100px; }
    .progress-bar { flex: 1; height: 7px; background: rgba(237,230,214,0.07); border-radius: 2px; overflow: hidden; }
    .progress-fill {
      height: 100%; width:0; border-radius: 2px; transition:width 1s var(--ease) .2s;
      background: linear-gradient(90deg, var(--green), var(--accent-bright));
      -webkit-mask-image: repeating-linear-gradient(90deg, #000 0 4px, transparent 4px 6px);
      mask-image: repeating-linear-gradient(90deg, #000 0 4px, transparent 4px 6px);
    }
    .progress-pct { font-family:var(--mono); font-size: 11px; color: var(--text-dim); flex-shrink: 0; }
    .stamp {
      display:inline-flex; align-items:center; justify-content:center; flex-direction:column;
      width: 46px; height: 46px; border-radius: 50%; flex-shrink:0;
      border: 2px solid var(--accent-bright);
      box-shadow: 0 0 0 3px rgba(232,163,61,0.14), inset 0 0 0 2px rgba(232,163,61,0.35);
      color: var(--accent-bright); font-family: var(--mono); font-size: 7.5px; font-weight: 700;
      letter-spacing: .04em; text-transform: uppercase; text-align:center; line-height:1.25;
      transform: rotate(-9deg); background: rgba(232,163,61,0.05);
    }
    .activity-list { display: flex; flex-direction: column; gap: 4px; padding: 0; margin: 0; }
    .activity-item { display: flex; align-items: flex-start; gap: 12px; padding: 12px 6px; border-radius: 3px; transition: background .15s ease; cursor:pointer; }
    .activity-item:hover { background: rgba(232,163,61,0.06); }
    .act-icon { font-size: 17px; flex-shrink: 0; line-height: 1.4; }
    .act-body { flex: 1; min-width: 0; }
    .act-text { font-size: 13px; margin: 0; line-height: 1.5; word-wrap: break-word; }
    .act-time { font-family:var(--mono); font-size: 11px; color: var(--text-dimmer); margin-top: 4px; display: block; }
    .team-list { display: flex; flex-direction: column; gap: 4px; padding: 0; margin: 0; }
    .team-item { display: flex; align-items: center; gap: 12px; padding: 10px 6px; border-radius: 3px; transition: background .15s ease; cursor:pointer; }
    .team-item:hover { background: rgba(232,163,61,0.06); }
    .member-avatar {
      position: relative; width: 38px; height: 38px; border-radius: 50%;
      background: var(--surface-2); border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      font-family:var(--mono); font-size: 12px; font-weight: 700; color: var(--accent-bright); flex-shrink: 0;
    }
    .online-dot { position: absolute; bottom: -1px; right: -1px; width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--surface); }
    .dot-active { background: var(--green-bright); }
    .dot-away { background: var(--accent-bright); }
    .member-info { flex: 1; min-width: 0; }
    .member-name { font-size: 13px; font-weight: 600; }
    .member-role { font-size: 11.5px; color: var(--text-dimmer); margin-top: 1px; font-family: var(--mono); }
    .member-projects { text-align: center; flex-shrink: 0; }

        <div style="display:flex;gap:12px;flex-wrap:wrap">
          <button class="btn-outline" style="border-color:rgba(196,81,74,0.4);color:#D6685F" onclick="go404()">Reset Password</button>
          <button class="btn-outline" style="border-color:rgba(196,81,74,0.4);color:#D6685F" onclick="go404()">Delete Account</button>
        </div>
      </div>
    `;
  }

  const pageRenderers = {
    dashboard: renderDashboard,
    runs: renderRuns,
    teams: renderTeams,
    reports: renderReports,
    schedule: renderSchedule,
    budget: renderBudget,
    settings: renderSettings
  };

  // ─── NAVIGATION ───
  function renderNav() {
    const mainItems = navItems.slice(0, 2);
    const mgmtItems = navItems.slice(2);
    function itemHtml(item) {
      const badge = item.id === "runs" ? `<span class="nav-badge">${courses.length}</span>` : "";
      return `<button class="nav-item ${state.activeNav === item.id ? "nav-active" : ""}" data-nav="${item.id}">
        <span class="nav-icon">${item.icon}</span><span>${item.label}</span>${badge}</button>`;
    }
    document.getElementById("nav-main").innerHTML = mainItems.map(itemHtml).join("");
    document.getElementById("nav-management").innerHTML = mgmtItems.map(itemHtml).join("");
  }

  function renderPage() {
    const page = pageMap[state.activeNav];
    document.getElementById("page-title-text").textContent = page.title;
    document.getElementById("page-sub-text").textContent = page.sub;
    document.getElementById("content-area").innerHTML = pageRenderers[state.activeNav]();
    renderNav();
    const settingsLogoutBtn = document.getElementById("settings-logout-btn");
    if (settingsLogoutBtn) settingsLogoutBtn.addEventListener("click", logout);
    window.scrollTo({ top: 0, left: 0, behavior: "instant" });
    animateStatBars();
    initAOS();
  }

  function navigateTo(id) {
    state.activeNav = id;
    closeSidebar();
    closeTopbarUserMenu();
    renderPage();
  }

  function openSidebar() {
    document.getElementById("sidebar").classList.add("sidebar-open");
    document.getElementById("sidebar-overlay").classList.add("show");
  }
  function closeSidebar() {
    document.getElementById("sidebar").classList.remove("sidebar-open");
    document.getElementById("sidebar-overlay").classList.remove("show");
  }
  function closeTopbarUserMenu() {
    document.getElementById("topbar-user").classList.remove("open");
  }

  // ─── EVENT BINDING ───
  document.getElementById("hamburger-btn").addEventListener("click", openSidebar);
  document.getElementById("close-sidebar-btn").addEventListener("click", closeSidebar);
  document.getElementById("sidebar-overlay").addEventListener("click", closeSidebar);
  document.getElementById("notif-btn").addEventListener("click", go404);
  document.getElementById("logout-btn").addEventListener("click", logout);
  document.getElementById("topbar-logout-btn").addEventListener("click", logout);
  document.getElementById("topbar-user-btn").addEventListener("click", function(e) {
    e.stopPropagation();
    document.getElementById("topbar-user").classList.toggle("open");
  });
  document.addEventListener("click", closeTopbarUserMenu);

  document.addEventListener("click", function(e) {
    const navBtn = e.target.closest("[data-nav]");
    if (navBtn) { navigateTo(navBtn.getAttribute("data-nav")); return; }
    const filterBtn = e.target.closest(".run-filter-btn");
    if (filterBtn) { state.runFilter = filterBtn.getAttribute("data-filter"); renderPage(); return; }
    const toggle = e.target.closest("[data-toggle]");
    if (toggle) {
      const key = toggle.getAttribute("data-toggle");
      state.settings[key] = !state.settings[key];
      renderPage();
      return;
    }
  });

  document.addEventListener("change", function(e) {
    if (e.target && e.target.id === "lang-select") {
      state.settings.language = e.target.value;
    }
  });

  // ─── INIT ───
  paintUserChrome();
  renderPage();
</script>
</body>
</html>
